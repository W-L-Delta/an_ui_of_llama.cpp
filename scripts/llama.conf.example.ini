; ============================================================
;  llama.conf.ini —— llama.cpp 本地对话 + 控制台 的配置文件
;
;  用法：复制本文件为 llama.conf.ini，再按你的机器改这几处：
;    [model]   各槽位指向 models\ 下的 gguf
;    [server]  port（控制台默认连 8080）
;    [tools]   workspace 改成你的工作区目录
;    [web]     enabled 是否允许模型联网
;
;  相对路径都以项目根目录为基准（即本文件所在 scripts\ 的上一级）。
; ============================================================

[models]
# 当前加载哪个槽位；保活和默认启动都按这个来
active = base

[model]
# 三个槽位：base / qwen36 / deepseek
# 槽位名是固定的（控制台和启动脚本按它找段），文件名随意换
model      = models\model-base.gguf
qwen36     = models\model-moe.gguf
deepseek   = models\model-reasoning.gguf
# 视觉投影（可选）：填了且 [vision] enabled 才会加载
mmproj     = models\mmproj-model-base-F16.gguf

[server]
host       = 127.0.0.1
port       = 8080
# 客户端请求时用的模型名
alias       = model-base
alias_qwen36 = model-moe
alias_deepseek = model-reasoning
threads    = 8
# 并发槽位；1 = 整个上下文给单个会话
parallel   = 1

[gpu]
# base 槽位的参数；其他槽位在自己的段里覆盖
n_gpu_layers = 99
ctx_size     = 32768
flash_attn   = on
# KV 缓存量化：q8_0 更准，q4_0 更省显存
cache_type_k = q8_0
cache_type_v = q8_0
max_tokens   = 4096

# ---------- 采样参数（每个槽位可以各有一套） ----------
temp               = 1.0
top_p              = 0.95
top_k              = 20
min_p              = 0.0
presence_penalty   = 1.0
frequency_penalty  = 0.0
repeat_penalty     = 1.0
repeat_last_n      = 64
dry_multiplier     =

[vision]
# 加载 mmproj（多模态）。需要 [model] mmproj 指向的文件真实存在
enabled = false

[qwen36]
# MoE 槽位示例：专家放内存，小显存卡也能跑大模型
ctx_size     = 32768
n_gpu_layers = 99
cache_type_k = q4_0
cache_type_v = q4_0
extra_args   = --cpu-moe
mmproj       = models\mmproj-model-moe-F16.gguf
max_tokens   = 4096

[deepseek]
# 推理模型槽位示例：关掉重复惩罚，交给思维链自己收敛
ctx_size         = 32768
n_gpu_layers     = 99
cache_type_k     = q4_0
cache_type_v     = q4_0
reasoning_format = deepseek
max_tokens       = 8192

[router]
# 实验性：llama-server 自带的 router 模式，可多模型热切换
enabled   = false
preset    = scripts\models.ini
models_max = 1

[extra]
# 追加到命令行的通用参数
args = --reasoning-budget 512

[sampling]
# 兜底采样参数：槽位段里没写的键用这里的值
temp               = 1.0
top_p              = 0.95
top_k              = 20
min_p              = 0.0
presence_penalty   = 1.0
frequency_penalty  = 0.0
repeat_penalty     = 1.0
repeat_last_n      = 64
dry_multiplier     =

[tools]
# 模型可用的工具权限：off / read / write / full
#   read  = list / read / glob / grep
#   write = 再加 write / edit / delete（限工作区）
#   full  = 再加 shell 命令，可访问工作区外
# level 是默认级别，ceiling 是单会话能开到的上限
level      = off
ceiling    = write
workspace  = D:\llama-workspace
max_rounds = 8

[web]
# 让模型联网：程序替它抓网页，模型只读文本
enabled       = false
engine        = bing     # 主引擎：bing / 360
fallback      = 360      # 主引擎没结果时的兜底（none 表示关掉）
max_results   = 5        # 最终交给模型几条
scan_pages    = 3        # 先扫几页候选（每页 10 条）
fetch_pages   = 2        # 自动抓前几条正文
fetch_chars   = 1600     # 每条正文摘录上限
max_chars     = 8000     # 单页正文截断
timeout       = 15
block_private = true     # 禁止访问内网/回环地址（防 SSRF）

[chat]
# 旧历史自动摘要：上下文占用超过阈值时压缩早期对话
summarize     = true
sum_threshold = 0.5      # 0.5 = 50%，可调 0.1–0.95
sum_keep      = 4        # 保留最近几轮原文
